services:
  postgres:
    image: postgres:15-alpine
    container_name: blender_help_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blender_help
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blender_help"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blender_help_net

  backend:
    build:
      context: ./backend
    container_name: blender_help_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blender_help?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blender_help_net

  frontend:
    build:
      context: ./frontend
    container_name: blender_help_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - blender_help_net

networks:
  blender_help_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
